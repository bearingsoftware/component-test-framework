name: risk-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
jobs:
  risk-gate:
    if: contains(fromJSON('["main"]'), github.event.pull_request.base.ref)
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: bearingsoftware/risk-gate/.github/workflows/risk-gate.yml@1f754a4bec9bc33596fab7a859745698a0df361a # main
    with:
      risk-gate-ref: 1f754a4bec9bc33596fab7a859745698a0df361a
      runs-on: '["ubuntu-latest"]'
      mode: enforce
    secrets:
      anthropic-api-key: ${{ secrets.RISK_GATE_ANTHROPIC_API_KEY }}
