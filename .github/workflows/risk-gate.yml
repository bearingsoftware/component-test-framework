name: risk-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
jobs:
  risk-gate:
    if: contains(fromJSON('["main"]'), github.event.pull_request.base.ref)
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: bearingsoftware/risk-gate/.github/workflows/risk-gate.yml@67973455d5d2778da186afa48fe7b2a3c6c7cd14 # main
    with:
      risk-gate-ref: 67973455d5d2778da186afa48fe7b2a3c6c7cd14
      runs-on: '["ubuntu-latest"]'
    secrets:
      anthropic-api-key: ${{ secrets.RISK_GATE_ANTHROPIC_API_KEY }}
