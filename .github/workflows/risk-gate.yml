name: risk-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
jobs:
  risk-gate:
    if: contains(fromJSON('["main"]'), github.event.pull_request.base.ref)
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: bearingsoftware/risk-gate/.github/workflows/risk-gate.yml@7e93cad7ec0e519e4300e9a0d4111ada51ce4901 # main
    with:
      risk-gate-ref: 7e93cad7ec0e519e4300e9a0d4111ada51ce4901
      runs-on: '["ubuntu-latest"]'
    secrets:
      anthropic-api-key: ${{ secrets.RISK_GATE_ANTHROPIC_API_KEY }}
