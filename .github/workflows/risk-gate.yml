name: risk-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
jobs:
  risk-gate:
    if: contains(fromJSON('["main"]'), github.event.pull_request.base.ref)
    permissions:
      contents: read
      pull-requests: write
      checks: write
      packages: read   # FINCH-549: install the pinned ctf for evidence (compute)
      actions: read    # FINCH-549: read the CI run and its ctf-evidence artifact
    uses: bearingsoftware/risk-gate/.github/workflows/risk-gate.yml@21169ece377a54b2b8f9e27722ef2f8b6b5df81f # main
    with:
      risk-gate-ref: 21169ece377a54b2b8f9e27722ef2f8b6b5df81f
      runs-on: '["ubuntu-latest"]'
      mode: enforce
    secrets:
      anthropic-api-key: ${{ secrets.RISK_GATE_ANTHROPIC_API_KEY }}
