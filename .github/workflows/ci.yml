name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    # Skip release-please PRs — they only touch CHANGELOG/version files.
    if: "!startsWith(github.head_ref, 'release-please--')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run test:lint

  unit-test:
    if: "!startsWith(github.head_ref, 'release-please--')"
    runs-on: ubuntu-latest
    # COMPONENT-15: the RedisClient tests run against a real Redis; without
    # REDIS_URL they skip. COMPONENT-16: the Mailpit client's integration
    # test sends real mail.
    services:
      redis:
        image: redis:7-alpine
        ports: ["56391:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.32
        ports: ["58025:8025", "51025:1025"]
    env:
      REDIS_URL: redis://localhost:56391
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # The UI step tests drive a real browser; they skip themselves without one.
      - name: Install Chromium for the UI step tests
        run: npx playwright install --with-deps chromium
      - name: Wait for Mailpit
        run: timeout 60 sh -c 'until curl -sf http://localhost:58025/api/v1/info; do sleep 1; done'
      - name: Run unit tests
        env:
          MAILPIT_URL: http://localhost:58025
          MAILPIT_SMTP: localhost:51025
        run: npm run test:unit
      # The built package under a real Cucumber run: entry points, step
      # registration and lifecycle hooks.
      - name: Run smoke tests
        run: npm run test:smoke

  # COMPONENT-11: the reference suite, four Cucumber workers sharing one
  # WireMock, Postgres and Redis, kept apart by workerIsolation.
  parallel-reference:
    if: "!startsWith(github.head_ref, 'release-please--')"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["55440:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56390:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
      wiremock:
        image: wiremock/wiremock:3.13.2
        ports: ["58443:8080"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for the SPA scenarios
        run: npx playwright install --with-deps chromium
      # The throwaway database needn't survive a crash. A services: container
      # can't take -c flags, but these three settings reload without a restart.
      - name: Take durability off the test database
        run: |
          node -e "
            const { Client } = require('pg')
            const c = new Client('postgres://postgres:postgres@localhost:55440/postgres')
            c.connect()
              .then(() => c.query(\"ALTER SYSTEM SET fsync = off\"))
              .then(() => c.query(\"ALTER SYSTEM SET synchronous_commit = off\"))
              .then(() => c.query(\"ALTER SYSTEM SET full_page_writes = off\"))
              .then(() => c.query('SELECT pg_reload_conf()'))
              .then(() => c.end())
              .catch((e) => { console.error(e); process.exit(1) })
          "
      - name: Wait for WireMock
        run: timeout 60 sh -c 'until curl -sf http://localhost:58443/__admin/health; do sleep 1; done'
      - name: Run the parallel reference suite
        run: npm run test:parallel

  playwright-test-example:
    if: "!startsWith(github.head_ref, 'release-please--')"
    runs-on: ubuntu-latest
    services:
      wiremock:
        image: wiremock/wiremock:3.13.2
        ports: ["58443:8080"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for WireMock
        run: timeout 60 sh -c 'until curl -sf http://localhost:58443/__admin/health; do sleep 1; done'
      - name: Run the Playwright Test example suite
        run: npm run test:playwright-test

  build:
    if: "!startsWith(github.head_ref, 'release-please--')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
