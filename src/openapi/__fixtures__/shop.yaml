openapi: 3.0.3
info: { title: Shop, version: '1' }
servers:
  - url: http://localhost:8080/api/v1
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders */ safely
    post:
      operationId: createOrder
  /orders/{orderId}:
    get:
      operationId: getOrder
    delete:
      operationId: cancelOrder
  /orders/mine:
    get:
      operationId: listMyOrders
  /health:
    $ref: '#/x-paths/health'
  /things:
    $ref: 'shared-paths.yaml#/things'
x-paths:
  health:
    get:
      operationId: health
